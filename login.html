<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ShopEase | Sign In</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body class="login-page">

```
<!-- Login Container -->

<div class="login-container">


    <!-- Login Box -->

    <div class="login-box">


        <!-- Logo -->

        <a href="index.html"
           class="login-logo">

            ShopEase

        </a>


        <h1>
            Welcome Back!
        </h1>


        <p class="login-subtitle">

            Sign in to your account
            to continue shopping.

        </p>



        <!-- Login Form -->

        <form id="loginForm">


            <!-- Email -->

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>



            <!-- Password -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>



            <!-- Remember Me -->

            <div class="remember-row">

                <label class="remember-label">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    <span>
                        Remember me
                    </span>

                </label>


                <a href="#">
                    Forgot Password?
                </a>

            </div>



            <!-- Sign In Button -->

            <button
                type="submit"
                class="login-button">

                Sign In

            </button>


        </form>



        <!-- Login Message -->

        <p id="loginMessage"
           class="login-message">
        </p>



        <!-- Register -->

        <div class="register-section">

            <p>
                Don't have an account?
            </p>

            <button
                type="button"
                onclick="createAccount()"
                class="register-button">

                Create Account

            </button>

        </div>



        <!-- Back to Home -->

        <a href="index.html"
           class="back-home">

            ← Back to ShopEase

        </a>


    </div>

</div>



<!-- JavaScript -->

<script src="js/script.js"></script>
```

</body>

</html>
